<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BistroCardapio - Sistema Real</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
body{font-family:'Inter',sans-serif;background:#f8fafc}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const KEY = 'lemgra_os_v2_real';
function loadInitial(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && p.restaurant && Array.isArray(p.menu)){
        if(p.restaurant.whatsapp) p.restaurant.whatsapp = String(p.restaurant.whatsapp).replace(/\D/g,'').slice(0,11);
        p.menu = p.menu.map(m=>({ ...m, stock: m.stock===undefined? 10 : m.stock, minStock: m.minStock===undefined? 5 : m.minStock }));
        if(!Array.isArray(p.sales)) p.sales=[];
        if(!Array.isArray(p.orders)) p.orders=[];
        if(!Array.isArray(p.tables)) p.tables=[1,2,3,4];
        if(!p.passwords) p.passwords={ admin:'', caixa:'', cozinha:'', entrega:'', estoque:'' };
        else { for(let k of ['admin','caixa','cozinha','entrega','estoque']) if(p.passwords[k]===undefined) p.passwords[k]=''; }
        return p;
      }
    }
  }catch(e){}
  return {
    restaurant:{ name:'', whatsapp:'', cover:'', message:'Obrigado pela preferência! Volte sempre.' },
    menu:[], tables:[1,2,3,4], orders:[], sales:[],
    passwords:{ admin:'', caixa:'', cozinha:'', entrega:'', estoque:'' }
  };
}
function parseHash(){
  const h = window.location.hash || '';
  if(!h || h==='#') return { view:'admin', mesa:'' };
  const clean = h.replace('#','');
  const parts = clean.split('?');
  const viewRaw = parts[0].replace('/','') || 'admin';
  const view = ['cliente','cozinha','entrega','admin','caixa','estoque'].includes(viewRaw) ? viewRaw : 'admin';
  const params = new URLSearchParams(parts[1] || '');
  return { view, mesa: params.get('mesa') || '' };
}
function goBack(){ if(window.history.length>1) window.history.back(); else window.location.hash='#/admin'; }
function formatBRL(v){ return 'R$ ' + Number(v||0).toFixed(2).replace('.',','); }
function timeOf(ts){ try{ return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function dateOf(ts){ try{ return new Date(ts).toLocaleDateString('pt-BR'); }catch(e){ return ''; } }
function readFileAsDataURL(file, cb){ const r=new FileReader(); r.onload=function(e){cb(e.target.result);}; r.readAsDataURL(file); }

function QRBox({ text, label }){
  const ref = useRef(null);
  useEffect(()=>{ if(!ref.current) return; ref.current.innerHTML=''; try{ new QRCode(ref.current,{ text, width:150, height:150, colorDark:'#0f172a', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M }); }catch(e){} },[text]);
  function download(){ const el = ref.current ? ref.current.querySelector('canvas, img') : null; if(!el) return; let url=''; if(el.tagName==='CANVAS') url=el.toDataURL('image/png'); else url=el.src; const a=document.createElement('a'); a.href=url; a.download='qr-'+label+'.png'; a.click(); }
  return (<div className="bg-white p-4 rounded-2xl border flex flex-col items-center"><div ref={ref} className="bg-white p-2"></div><p className="text-sm font-bold mt-2">{label}</p><p className="text-[11px] text-slate-400 break-all text-center mt-1">{text}</p><button onClick={download} className="mt-3 w-full bg-slate-900 text-white py-2 rounded-lg text-sm font-bold">Baixar QR</button></div>);
}


function AuthGate({ role, title, passwords, unlocked, onUnlock, children }){
  const [input, setInput] = useState('');
  const [error, setError] = useState('');
  const [showReset, setShowReset] = useState(false);
  const required = (passwords && passwords[role]) || '';
  if(!required) return (<div><div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold px-4 py-2 text-center">Sem senha definida para {title}. Peça ao admin para definir uma senha em Admin, Senhas de acesso.</div>{children}</div>);
  if(unlocked) return children;
  function tryUnlock(){ if(input===required){ onUnlock(role); setError(''); } else { setError('Senha incorreta. Tente de novo.'); } }
  return (
    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
      <div className="bg-white w-full max-w-sm rounded-2xl border p-6 text-center">
        <p className="text-4xl">🔒</p>
        <h1 className="font-extrabold text-xl mt-2">{title}</h1>
        <p className="text-sm text-slate-500 mt-1">Digite a senha de {title.toLowerCase()} para entrar.</p>
        <input type="password" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') tryUnlock(); }} placeholder="Senha" autoFocus className="w-full border rounded-xl p-3 mt-4 text-center text-lg tracking-widest" />
        {error && <p className="text-sm text-red-600 font-semibold mt-2">{error}</p>}
        <button onClick={tryUnlock} className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl mt-3">Entrar</button><button onClick={goBack} className="w-full border font-bold py-3 rounded-xl mt-2 text-sm">← Voltar</button>
        <a href="#/cliente" className="block text-sm text-slate-500 mt-3">Sou cliente, ir para o cardápio</a>
        {role==='admin' && (
          <div className="mt-4 border-t pt-3">
            {!showReset ? <button onClick={()=>setShowReset(true)} className="text-xs text-slate-400 underline">Esqueci a senha do admin</button> : <div><p className="text-xs text-amber-700 font-semibold">Quem está com o aparelho pode zerar a senha. Só use se você é o dono.</p><button onClick={()=>{ onUnlock('__reset_admin__'); }} className="mt-2 w-full bg-red-50 text-red-600 border border-red-200 font-bold py-2 rounded-lg text-sm">Zerar senha do admin e entrar</button></div>}
          </div>
        )}
        <p className="text-xs text-slate-400 mt-3">A senha fica salva só neste navegador. Não é senha de banco, serve para separar as funções no dia a dia.</p>
      </div>
    </div>
  );
}

function AdminView({ data, setData, showToast }){
  const [form, setForm] = useState({ name:'', desc:'', price:'', category:'Geral', img:'', active:true, stock:'10', minStock:'5' });
  const [editingId, setEditingId] = useState(null);
  const [tab, setTab] = useState('restaurante');
  const tabsList = [{id:'restaurante', label:'🏪 Restaurante'}, {id:'cardapio', label:'🍽️ Cardápio'}, {id:'mesas', label:'📱 Mesas e QR'}, {id:'senhas', label:'🔒 Senhas'}, {id:'links', label:'🔗 Links'}, {id:'pedidos', label:'🧾 Pedidos'}];
  const tabIndex = tabsList.findIndex(x=>x.id===tab);
  const goPrevTab = ()=>{ if(tabIndex>0) setTab(tabsList[tabIndex-1].id); else goBack(); };
  const goNextTab = ()=>{ if(tabIndex<tabsList.length-1) setTab(tabsList[tabIndex+1].id); };
  const base = window.location.href.split('#')[0];
  const links = [
    { label:'Cliente', url: base + '#/cliente', desc:'Cardápio para o cliente' },
    { label:'Frente de Caixa', url: base + '#/caixa', desc:'PDV rápido para venda no balcão' },
    { label:'Cozinha', url: base + '#/cozinha', desc:'Só pedidos pendentes' },
    { label:'Entrega', url: base + '#/entrega', desc:'Só entregas prontas' },
    { label:'Estoque', url: base + '#/estoque', desc:'Controla quantidade de cada item' },
    { label:'Admin', url: base + '#/admin', desc:'Configurações' },
  ];
  function updateRestaurant(f,v){ setData(prev=>({...prev, restaurant:{...prev.restaurant, [f]:v}})); }
  function saveMenuItem(){
    if(!form.name.trim()){ showToast('Coloque o nome do item'); return; }
    const price = parseFloat(String(form.price).replace(',','.')) || 0;
    const stock = parseInt(form.stock) || 0;
    const minStock = parseInt(form.minStock) || 0;
    if(editingId){
      setData(prev=>({...prev, menu: prev.menu.map(m=> m.id===editingId ? {...m, name:form.name, desc:form.desc, price, category:form.category||'Geral', img:form.img, active:form.active, stock, minStock} : m)}));
      showToast('Item atualizado');
    } else {
      const item = { id: Date.now(), name:form.name, desc:form.desc, price, category:form.category||'Geral', img:form.img, active:form.active, stock, minStock };
      setData(prev=>({...prev, menu:[...prev.menu, item]}));
      showToast('Item adicionado');
    }
    setForm({ name:'', desc:'', price:'', category:'Geral', img:'', active:true, stock:'10', minStock:'5' });
    setEditingId(null);
  }
  function editItem(m){ setForm({ name:m.name, desc:m.desc||'', price:String(m.price), category:m.category||'Geral', img:m.img||'', active:m.active!==false, stock:String(m.stock ?? 10), minStock:String(m.minStock ?? 5) }); setEditingId(m.id); window.scrollTo({top:0, behavior:'smooth'}); }
  function deleteItem(id){ if(confirm('Excluir este item?')) setData(prev=>({...prev, menu: prev.menu.filter(m=>m.id!==id)})); }
  function toggleActive(id){ setData(prev=>({...prev, menu: prev.menu.map(m=> m.id===id ? {...m, active:!m.active} : m)})); }
  function addTable(){ const next = data.tables.length ? Math.max(...data.tables)+1 : 1; setData(prev=>({...prev, tables:[...prev.tables, next]})); }
  function removeTable(n){ setData(prev=>({...prev, tables: prev.tables.filter(t=>t!==n)})); }
  function copyLink(url){ navigator.clipboard.writeText(url).then(()=> showToast('Link copiado')); }
  function clearFinished(){ setData(prev=>({...prev, orders: prev.orders.filter(o=> o.status==='pending' || o.status==='ready')})); showToast('Pedidos finalizados limpos'); }
  function clearAllOrders(){ if(confirm('Apagar todos os pedidos?')) setData(prev=>({...prev, orders:[]})); }
  function resetAll(){ if(confirm('Apagar tudo e começar do zero?')){ localStorage.removeItem(KEY); setData({ restaurant:{ name:'', whatsapp:'', cover:'', message:'Obrigado pela preferência! Volte sempre.' }, menu:[], tables:[1,2,3,4], orders:[], sales:[] }); } }
  const todaySales = (data.sales||[]).filter(s=> dateOf(s.createdAt)===dateOf(Date.now()));
  const todayTotal = todaySales.reduce((a,s)=>a+s.total,0);
  return (
    <div className="min-h-screen">
      <header className="bg-slate-900 text-white p-4 sticky top-0 z-20"><div className="max-w-5xl mx-auto flex justify-between items-center"><div className="flex items-center gap-3"><button onClick={goPrevTab} className="bg-white/10 px-3 py-2 rounded-lg text-sm font-bold">← Voltar</button><div><p className="font-extrabold text-lg">Bistro<span className="text-orange-500">Cardapio</span></p><p className="text-xs text-slate-400">Painel real, sem dados de demonstração</p></div></div><div className="flex gap-2"><a href="#/caixa" className="bg-green-600 px-4 py-2 rounded-lg text-sm font-bold">Abrir Caixa</a><a href="#/estoque" className="bg-amber-500 text-slate-900 px-4 py-2 rounded-lg text-sm font-bold">Estoque</a></div></div></header>
      <main className="max-w-5xl mx-auto p-4 space-y-6 pb-20">
        {!data.restaurant.name && (<div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl"><p className="font-bold text-amber-900">Comece aqui: cadastre o restaurante abaixo.</p><p className="text-sm text-amber-800 mt-1">Sem nome e sem cardápio, o cliente vê uma tela vazia de verdade, não um restaurante fake.</p></div>)}
        <div className="grid grid-cols-3 gap-3">
          <div className="bg-white p-4 rounded-2xl border"><p className="text-xs font-bold text-slate-400">VENDAS HOJE</p><p className="font-extrabold text-xl mt-1">{formatBRL(todayTotal)}</p><p className="text-xs text-slate-500">{todaySales.length} vendas no caixa</p></div>
          <div className="bg-white p-4 rounded-2xl border"><p className="text-xs font-bold text-slate-400">PEDIDOS</p><p className="font-extrabold text-xl mt-1">{data.orders.length}</p><p className="text-xs text-slate-500">Total de pedidos do cardápio</p></div>
          <div className="bg-white p-4 rounded-2xl border"><p className="text-xs font-bold text-slate-400">ESTOQUE BAIXO</p><p className="font-extrabold text-xl mt-1 text-red-600">{data.menu.filter(m=> (m.stock ?? 0) <= (m.minStock ?? 5)).length}</p><p className="text-xs text-slate-500">Itens abaixo do mínimo</p></div>
        </div>
        <div className="bg-white p-2 rounded-2xl border flex gap-2 overflow-x-auto sticky top-[68px] z-10">
          {[
            {id:'restaurante', label:'🏪 Restaurante'},
            {id:'cardapio', label:'🍽️ Cardápio'},
            {id:'mesas', label:'📱 Mesas e QR'},
            {id:'senhas', label:'🔒 Senhas'},
            {id:'links', label:'🔗 Links'},
            {id:'pedidos', label:'🧾 Pedidos'},
          ].map(x=>(<button key={x.id} onClick={()=>setTab(x.id)} className={'px-4 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap ' + (tab===x.id ? 'bg-slate-900 text-white' : 'bg-slate-100')}>{x.label}</button>))}
        </div>
        <section style={{display: tab==='restaurante' ? 'block' : 'none'}} className="bg-white p-5 rounded-2xl border">
          <h2 className="font-bold text-lg mb-4">1. Restaurante</h2>
          <div className="grid md:grid-cols-2 gap-4">
            <div><label className="text-sm font-semibold">Nome do restaurante</label><input value={data.restaurant.name} onChange={e=>updateRestaurant('name', e.target.value)} placeholder="Ex: Lanchonete do Centro" className="w-full border rounded-lg p-2.5 mt-1" /></div>
            <div><label className="text-sm font-semibold">WhatsApp com DDD, só números</label><input value={data.restaurant.whatsapp} onChange={e=>updateRestaurant('whatsapp', e.target.value.replace(/\D/g,'').slice(0,11))} placeholder="Ex: 17999999999" maxLength={11} inputMode="numeric" className="w-full border rounded-lg p-2.5 mt-1" /><div className="flex justify-between mt-1"><p className="text-xs text-slate-400">Travado em 11 dígitos. Se ficar vazio, o pedido só fica salvo.</p><span className={'text-xs font-bold ml-2 shrink-0 ' + (data.restaurant.whatsapp.length===11 ? 'text-green-600' : 'text-slate-400')}>{data.restaurant.whatsapp.length}/11</span></div>{data.restaurant.whatsapp.length>0 && data.restaurant.whatsapp.length<11 && <p className="text-xs text-amber-600 font-semibold mt-1">Faltam {11 - data.restaurant.whatsapp.length} dígitos. Precisa ter DDD + 9 dígitos.</p>}{data.restaurant.whatsapp.length===11 && <p className="text-xs text-green-600 font-semibold mt-1">Número travado e válido: ({data.restaurant.whatsapp.slice(0,2)}) {data.restaurant.whatsapp.slice(2,7)}-{data.restaurant.whatsapp.slice(7)}</p>}</div>
            <div><label className="text-sm font-semibold">Link da foto de capa</label><input value={data.restaurant.cover} onChange={e=>updateRestaurant('cover', e.target.value)} placeholder="Cole o link de uma foto" className="w-full border rounded-lg p-2.5 mt-1" /><label className="block mt-2 text-sm text-blue-600 font-semibold cursor-pointer">Ou enviar foto<input type="file" accept="image/*" className="hidden" onChange={e=>{ if(e.target.files[0]) readFileAsDataURL(e.target.files[0], url=> updateRestaurant('cover', url)); }} /></label>{data.restaurant.cover && <img src={data.restaurant.cover} className="w-full h-32 object-cover rounded-lg mt-2" />}</div>
            <div><label className="text-sm font-semibold">Mensagem de agradecimento</label><textarea value={data.restaurant.message} onChange={e=>updateRestaurant('message', e.target.value)} rows="3" className="w-full border rounded-lg p-2.5 mt-1"></textarea></div>
          </div>
        </section>
        <section style={{display: tab==='cardapio' ? 'block' : 'none'}} className="bg-white p-5 rounded-2xl border">
          <h2 className="font-bold text-lg mb-1">2. Cardápio + Estoque inicial</h2>
          <p className="text-sm text-slate-500 mb-4">Ao cadastrar, já defina o estoque. O estoque baixa sozinho a cada venda no caixa ou pedido do cliente.</p>
          <div className="grid md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl">
            <input value={form.name} onChange={e=>setForm({...form, name:e.target.value})} placeholder="Nome, ex: X-Salada" className="border rounded-lg p-2.5 bg-white" />
            <input value={form.price} onChange={e=>setForm({...form, price:e.target.value})} placeholder="Preço, ex: 28.90" inputMode="decimal" className="border rounded-lg p-2.5 bg-white" />
            <input value={form.category} onChange={e=>setForm({...form, category:e.target.value})} placeholder="Categoria" className="border rounded-lg p-2.5 bg-white" />
            <input value={form.img} onChange={e=>setForm({...form, img:e.target.value})} placeholder="Link da foto" className="border rounded-lg p-2.5 bg-white" />
            <input value={form.stock} onChange={e=>setForm({...form, stock:e.target.value.replace(/\D/g,'').slice(0,4)})} placeholder="Estoque inicial, ex: 20" inputMode="numeric" className="border rounded-lg p-2.5 bg-white" />
            <input value={form.minStock} onChange={e=>setForm({...form, minStock:e.target.value.replace(/\D/g,'').slice(0,4)})} placeholder="Estoque mínimo para alertar, ex: 5" inputMode="numeric" className="border rounded-lg p-2.5 bg-white" />
            <textarea value={form.desc} onChange={e=>setForm({...form, desc:e.target.value})} placeholder="Descrição curta" rows="2" className="border rounded-lg p-2.5 bg-white md:col-span-2"></textarea>
            <div className="flex gap-3 items-center md:col-span-2">
              <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={form.active} onChange={e=>setForm({...form, active:e.target.checked})} /> Ativo</label>
              <label className="text-sm text-blue-600 font-semibold cursor-pointer">Enviar foto<input type="file" accept="image/*" className="hidden" onChange={e=>{ if(e.target.files[0]) readFileAsDataURL(e.target.files[0], url=> setForm(f=>({...f, img:url}))); }} /></label>
              {form.img && <img src={form.img} className="w-12 h-12 object-cover rounded" />}
              <button onClick={saveMenuItem} className="ml-auto bg-slate-900 text-white px-5 py-2.5 rounded-lg font-bold text-sm">{editingId ? 'Salvar edição' : 'Adicionar item'}</button>
              {editingId && <button onClick={()=>{setEditingId(null); setForm({name:'',desc:'',price:'',category:'Geral',img:'',active:true,stock:'10',minStock:'5'});}} className="text-sm text-slate-500">Cancelar</button>}
            </div>
          </div>
          <div className="mt-4 space-y-2">
            {data.menu.length===0 && <p className="text-sm text-slate-400">Nenhum item ainda.</p>}
            {data.menu.map(m=>(
              <div key={m.id} className="flex gap-3 items-center border rounded-xl p-3">
                {m.img ? <img src={m.img} className="w-14 h-14 object-cover rounded-lg" /> : <div className="w-14 h-14 bg-slate-100 rounded-lg flex items-center justify-center text-xs text-slate-400">Sem foto</div>}
                <div className="flex-1"><p className="font-bold">{m.name} <span className="text-xs font-normal text-slate-400">• {m.category}</span></p><p className="text-xs text-slate-500">{m.desc}</p><p className="font-bold mt-1">{formatBRL(m.price)} • Estoque: {m.stock ?? 0} • Mín: {m.minStock ?? 5} {m.active ? '' : '• Pausado'}</p></div>
                <button onClick={()=>toggleActive(m.id)} className="text-sm font-semibold text-blue-600">{m.active ? 'Pausar' : 'Ativar'}</button>
                <button onClick={()=>editItem(m)} className="text-sm font-semibold">Editar</button>
                <button onClick={()=>deleteItem(m.id)} className="text-sm font-semibold text-red-500">Excluir</button>
              </div>
            ))}
          </div>
        </section>
        <section style={{display: tab==='mesas' ? 'block' : 'none'}} className="bg-white p-5 rounded-2xl border">
          <h2 className="font-bold text-lg mb-1">3. Mesas e QR Code real</h2>
          <div className="flex gap-2 mb-4"><button onClick={addTable} className="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold">+ Adicionar mesa</button><button onClick={resetAll} className="text-sm text-red-500 font-semibold px-3">Zerar tudo</button></div>
          <div className="grid md:grid-cols-3 gap-4">{data.tables.map(n=>(<div key={n}><QRBox text={base + '#/cliente?mesa=' + n} label={'Mesa ' + n} /><button onClick={()=>removeTable(n)} className="w-full text-center text-xs text-red-500 mt-1">Remover mesa {n}</button></div>))}</div>
        </section>
        <section style={{display: tab==='senhas' ? 'block' : 'none'}} className="bg-white p-5 rounded-2xl border">
          <h2 className="font-bold text-lg mb-1">Senhas de acesso</h2>
          <p className="text-sm text-slate-500 mb-4">Cliente não tem senha, é aberto. Cada função tem sua senha. Deixe vazio para deixar livre, ou coloque de 4 a 12 caracteres. Troque aqui quando alguém sair da equipe.</p>
          <div className="grid md:grid-cols-2 gap-4">
            {[
              {key:'admin', label:'Admin - dono, configura tudo', hint:'Se definir, o Admin pede senha para entrar'},
              {key:'caixa', label:'Frente de Caixa - quem vende no balcão', hint:'Só abre o caixa'},
              {key:'cozinha', label:'Cozinha - quem prepara', hint:'Só vê pedidos pendentes'},
              {key:'entrega', label:'Entrega - motoca', hint:'Só vê entregas prontas'},
              {key:'estoque', label:'Estoque - quem controla estoque', hint:'Só mexe no estoque'},
            ].map(r=>(
              <div key={r.key} className="border rounded-xl p-3">
                <label className="text-sm font-bold">{r.label}</label>
                <p className="text-xs text-slate-400">{r.hint}</p>
                <div className="flex gap-2 mt-2">
                  <input type="password" value={(data.passwords && data.passwords[r.key]) || ''} onChange={e=>{ const v=e.target.value.replace(/\s/g,'').slice(0,12); setData(prev=>({...prev, passwords:{...prev.passwords, [r.key]: v}})); }} placeholder="Sem senha, livre" className="flex-1 border rounded-lg p-2.5" />
                  <button onClick={()=>{ setData(prev=>({...prev, passwords:{...prev.passwords, [r.key]: ''}})); showToast('Senha de ' + r.key + ' removida'); }} className="text-xs font-bold text-red-500 border border-red-200 px-3 rounded-lg">Limpar</button>
                </div>

function CaixaView({ data, setData, showToast }){
  const [search, setSearch] = useState('');
  const [cart, setCart] = useState([]);
  const [payment, setPayment] = useState('pix');
  const [paid, setPaid] = useState('');
  const [lastSale, setLastSale] = useState(null);
  const todaySales = (data.sales||[]).filter(s=> dateOf(s.createdAt)===dateOf(Date.now()));
  const todayTotal = todaySales.reduce((a,s)=>a+s.total,0);
  const filtered = data.menu.filter(m=> m.active!==false && m.name.toLowerCase().includes(search.toLowerCase()));
  const cartDetailed = cart.map(c=>{ const it = data.menu.find(m=>m.id===c.id); return it ? {...it, qty:c.qty} : null; }).filter(Boolean);
  const total = cartDetailed.reduce((a,i)=>a+i.price*i.qty,0);
  const paidNum = parseFloat(String(paid).replace(',','.')) || 0;
  const change = payment==='dinheiro' ? Math.max(0, paidNum - total) : 0;
  function addItem(m){
    if((m.stock ?? 0) <= 0){ showToast(m.name + ' está sem estoque'); return; }
    const inCart = cart.find(x=>x.id===m.id)?.qty || 0;
    if(inCart + 1 > (m.stock ?? 0)){ showToast('Estoque insuficiente para ' + m.name + '. Tem ' + m.stock + ' em estoque.'); return; }
    setCart(prev=>{ const ex = prev.find(x=>x.id===m.id); if(ex) return prev.map(x=> x.id===m.id ? {...x, qty:x.qty+1} : x); return [...prev, {id:m.id, qty:1}]; });
  }
  function changeQty(id, delta){
    setCart(prev=> prev.map(x=>{ if(x.id!==id) return x; const it = data.menu.find(m=>m.id===id); const next = x.qty+delta; if(next > (it?.stock ?? 0)){ showToast('Sem estoque suficiente'); return x; } return {...x, qty:next}; }).filter(x=>x.qty>0));
  }
  function finalize(){
    if(cartDetailed.length===0){ showToast('Adicione um item para vender'); return; }
    if(payment==='dinheiro' && paidNum < total){ showToast('Valor pago menor que o total'); return; }
    for(let it of cartDetailed){ const stock = data.menu.find(m=>m.id===it.id)?.stock ?? 0; if(it.qty > stock){ showToast('Sem estoque para ' + it.name); return; } }
    const sale = { id: String(Date.now()).slice(-6), items: cartDetailed.map(i=>({name:i.name, price:i.price, qty:i.qty})), total, payment, paid: payment==='dinheiro' ? paidNum : total, change, createdAt: Date.now(), origin:'caixa' };
    setData(prev=>({...prev, sales:[...(prev.sales||[]), sale], menu: prev.menu.map(m=>{ const sold = cartDetailed.find(c=>c.id===m.id); if(!sold) return m; return {...m, stock: Math.max(0, (m.stock ?? 0) - sold.qty)}; })}));
    setCart([]); setPaid(''); setLastSale(sale); showToast('Venda #' + sale.id + ' finalizada');
  }
  return (
    <div className="min-h-screen">
      <header className="bg-slate-900 text-white p-4 sticky top-0 z-20"><div className="max-w-6xl mx-auto flex justify-between items-center"><div className="flex items-center gap-3"><button onClick={goBack} className="bg-white/10 px-3 py-2 rounded-lg text-sm font-bold">← Voltar</button><div><p className="font-extrabold text-lg">Frente de Caixa</p><p className="text-xs text-slate-400">{data.restaurant.name || 'Sem restaurante'} • Hoje: {formatBRL(todayTotal)} em {todaySales.length} vendas</p></div></div><div className="flex gap-2"><a href="#/admin" className="bg-white/10 px-3 py-2 rounded-lg text-sm font-bold">Admin</a><a href="#/estoque" className="bg-amber-500 text-slate-900 px-3 py-2 rounded-lg text-sm font-bold">Estoque</a></div></div></header>
      <main className="max-w-6xl mx-auto p-4 grid lg:grid-cols-3 gap-4 pb-20">
        <div className="lg:col-span-2">
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar item, ex: X-Salada" className="w-full border rounded-xl p-3 bg-white mb-3" />
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            {filtered.length===0 && <p className="text-sm text-slate-400 col-span-full bg-white p-4 rounded-xl text-center">Nenhum item ativo. Cadastre no Admin.</p>}
            {filtered.map(m=>(
              <button key={m.id} onClick={()=>addItem(m)} className="bg-white p-3 rounded-2xl border text-left">
                {m.img ? <img src={m.img} className="w-full h-20 object-cover rounded-lg" /> : <div className="w-full h-20 bg-slate-100 rounded-lg flex items-center justify-center text-xs text-slate-400">Sem foto</div>}
                <p className="font-bold mt-2 text-sm">{m.name}</p><p className="font-bold">{formatBRL(m.price)}</p>
                <p className={'text-xs font-bold mt-1 ' + ((m.stock ?? 0)===0 ? 'text-red-600' : (m.stock ?? 0) <= (m.minStock ?? 5) ? 'text-amber-600' : 'text-green-600')}>{(m.stock ?? 0)===0 ? 'SEM ESTOQUE' : 'Estoque: ' + m.stock}</p>
              </button>
            ))}
          </div>
          <div className="bg-white p-4 rounded-2xl border mt-4"><h3 className="font-bold">Vendas de hoje</h3>{todaySales.length===0 && <p className="text-sm text-slate-400 mt-2">Nenhuma venda hoje ainda.</p>}<div className="space-y-2 mt-2">{[...todaySales].reverse().slice(0,10).map(s=>(<div key={s.id} className="flex justify-between text-sm border rounded-lg p-2"><span>#{s.id} • {timeOf(s.createdAt)} • {s.payment} • {s.items.map(i=> i.qty+'x '+i.name).join(', ')}</span><b>{formatBRL(s.total)}</b></div>))}</div></div>
        </div>
        <div className="bg-white p-5 rounded-2xl border h-fit sticky top-20">
          <h2 className="font-bold text-lg">Venda atual</h2>
          <div className="space-y-2 my-4">{cartDetailed.length===0 && <p className="text-sm text-slate-400">Toque em um item para adicionar.</p>}{cartDetailed.map(i=>(<div key={i.id} className="flex justify-between items-center border rounded-lg p-2"><div><p className="font-bold text-sm">{i.name}</p><p className="text-xs">{formatBRL(i.price)} cada</p></div><div className="flex items-center gap-2"><button onClick={()=>changeQty(i.id,-1)} className="w-7 h-7 bg-slate-100 rounded-full font-bold">-</button><span className="font-bold">{i.qty}</span><button onClick={()=>changeQty(i.id,1)} className="w-7 h-7 bg-slate-100 rounded-full font-bold">+</button><span className="font-bold text-sm ml-1">{formatBRL(i.price*i.qty)}</span></div></div>))}</div>
          <div className="flex gap-2">{['pix','dinheiro','cartao','debito'].map(p=>(<button key={p} onClick={()=>setPayment(p)} className={'flex-1 py-2.5 rounded-lg text-sm font-bold capitalize ' + (payment===p ? 'bg-slate-900 text-white' : 'border')}>{p==='cartao' ? 'Crédito' : p}</button>))}</div>
          {payment==='dinheiro' && <div className="mt-3"><label className="text-sm font-semibold">Valor pago em dinheiro</label><input value={paid} onChange={e=>setPaid(e.target.value.replace(/[^0-9.,]/g,''))} placeholder="Ex: 50.00" inputMode="decimal" className="w-full border rounded-lg p-2.5 mt-1" /><p className="text-sm mt-1">Troco: <b>{formatBRL(change)}</b></p></div>}
          <div className="flex justify-between font-extrabold text-xl mt-4 pt-3 border-t"><span>Total</span><span>{formatBRL(total)}</span></div>
          <button onClick={finalize} className="w-full bg-green-600 text-white font-bold py-4 rounded-xl mt-3">Finalizar venda</button>
          <button onClick={()=>{setCart([]); setPaid('');}} className="w-full border font-bold py-2.5 rounded-xl mt-2 text-sm">Limpar</button>
        </div>
      </main>
      {lastSale && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4"><div className="absolute inset-0 bg-black/50" onClick={()=>setLastSale(null)}></div><div className="relative bg-white w-full max-w-sm rounded-2xl p-6 text-center"><p className="text-4xl">🧾</p><h2 className="font-bold text-xl mt-2">Venda #{lastSale.id} concluída</h2><p className="text-sm text-slate-500 mt-1">{lastSale.items.map(i=> i.qty+'x '+i.name).join(', ')}</p><p className="font-bold mt-2">Total: {formatBRL(lastSale.total)} • {lastSale.payment}</p>{lastSale.payment==='dinheiro' && <p className="text-sm">Pago: {formatBRL(lastSale.paid)} • Troco: {formatBRL(lastSale.change)}</p>}<p className="text-xs text-slate-400 mt-2">Estoque já foi baixado automaticamente.</p><button onClick={()=>setLastSale(null)} className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl mt-4">Nova venda</button></div></div>
      )}
    </div>
  );
}

function EstoqueView({ data, setData, showToast }){
  const [filter, setFilter] = useState('todos');
  const [adjust, setAdjust] = useState({});
  const filtered = data.menu.filter(m=>{
    if(filter==='baixo') return (m.stock ?? 0) <= (m.minStock ?? 5) && (m.stock ?? 0) > 0;
    if(filter==='zerado') return (m.stock ?? 0) === 0;
    return true;
  });
  const totalValue = data.menu.reduce((a,m)=>a + (m.stock ?? 0)*m.price,0);
  const lowCount = data.menu.filter(m=> (m.stock ?? 0) <= (m.minStock ?? 5)).length;
  function changeStock(id, delta){
    setData(prev=>({...prev, menu: prev.menu.map(m=> m.id===id ? {...m, stock: Math.max(0, (m.stock ?? 0)+delta)} : m)}));
  }
  function setStock(id, val){
    const n = parseInt(val) || 0;
    setData(prev=>({...prev, menu: prev.menu.map(m=> m.id===id ? {...m, stock:n} : m)}));
  }
  function setMin(id, val){
    const n = parseInt(val) || 0;
    setData(prev=>({...prev, menu: prev.menu.map(m=> m.id===id ? {...m, minStock:n} : m)}));
  }
  function applyAdjust(id){
    const v = parseInt(adjust[id]) || 0;
    if(v===0) return;
    changeStock(id, v);
    setAdjust(prev=>({...prev, [id]:''}));
    showToast('Estoque atualizado');
  }
  return (
    <div className="min-h-screen">
      <header className="bg-slate-900 text-white p-4 sticky top-0 z-20"><div className="max-w-5xl mx-auto flex justify-between items-center"><div className="flex items-center gap-3"><button onClick={goBack} className="bg-white/10 px-3 py-2 rounded-lg text-sm font-bold">← Voltar</button><div><p className="font-extrabold text-lg">Estoque</p><p className="text-xs text-slate-400">{data.restaurant.name || 'Sem restaurante'} • Valor em estoque: {formatBRL(totalValue)}</p></div></div><div className="flex gap-2"><a href="#/caixa" className="bg-green-600 px-3 py-2 rounded-lg text-sm font-bold">Caixa</a><a href="#/admin" className="bg-white/10 px-3 py-2 rounded-lg text-sm font-bold">Admin</a></div></div></header>
      <main className="max-w-5xl mx-auto p-4 pb-20">
        <div className="grid grid-cols-3 gap-3 mb-4">
          <div className="bg-white p-4 rounded-2xl border"><p className="text-xs font-bold text-slate-400">ITENS</p><p className="font-extrabold text-xl">{data.menu.length}</p></div>
          <div className="bg-white p-4 rounded-2xl border"><p className="text-xs font-bold text-slate-400">VALOR EM ESTOQUE</p><p className="font-extrabold text-xl">{formatBRL(totalValue)}</p></div>
          <div className="bg-white p-4 rounded-2xl border"><p className="text-xs font-bold text-slate-400">ABAIXO DO MÍNIMO</p><p className="font-extrabold text-xl text-red-600">{lowCount}</p></div>
        </div>
        <div className="flex gap-2 mb-4">{['todos','baixo','zerado'].map(f=>(<button key={f} onClick={()=>setFilter(f)} className={'px-4 py-2 rounded-full text-sm font-bold capitalize ' + (filter===f ? 'bg-slate-900 text-white' : 'bg-white border')}>{f==='todos' ? 'Todos' : f==='baixo' ? 'Estoque baixo' : 'Zerados'}</button>))}</div>
        {data.menu.length===0 && <div className="bg-white p-6 rounded-2xl text-center"><p className="font-bold">Nenhum item no estoque</p><p className="text-sm text-slate-500 mt-1">Cadastre itens no Admin com estoque inicial.</p><a href="#/admin" className="inline-block mt-3 bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold">Ir para Admin</a></div>}
        <div className="space-y-3">
          {filtered.map(m=>{
            const status = (m.stock ?? 0)===0 ? 'ZERADO' : (m.stock ?? 0) <= (m.minStock ?? 5) ? 'BAIXO' : 'OK';
            const color = status==='ZERADO' ? 'bg-red-100 text-red-700' : status==='BAIXO' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700';
            return (
              <div key={m.id} className="bg-white p-4 rounded-2xl border flex flex-col md:flex-row md:items-center gap-3">
                {m.img ? <img src={m.img} className="w-14 h-14 object-cover rounded-lg" /> : <div className="w-14 h-14 bg-slate-100 rounded-lg flex items-center justify-center text-xs text-slate-400">Sem foto</div>}
                <div className="flex-1"><p className="font-bold">{m.name} <span className={'text-xs px-2 py-0.5 rounded-full ml-1 ' + color}>{status}</span></p><p className="text-xs text-slate-500">{m.category} • {formatBRL(m.price)} cada</p><div className="flex gap-3 mt-2 text-sm"><label>Estoque: <input type="number" value={m.stock ?? 0} onChange={e=>setStock(m.id, e.target.value)} className="w-16 border rounded p-1 text-center font-bold" /></label><label>Mínimo: <input type="number" value={m.minStock ?? 5} onChange={e=>setMin(m.id, e.target.value)} className="w-16 border rounded p-1 text-center" /></label></div></div>
                <div className="flex items-center gap-2"><button onClick={()=>changeStock(m.id,-1)} className="w-9 h-9 bg-slate-100 rounded-full font-bold text-lg">-</button><span className="font-extrabold text-lg w-10 text-center">{m.stock ?? 0}</span><button onClick={()=>changeStock(m.id,1)} className="w-9 h-9 bg-slate-100 rounded-full font-bold text-lg">+</button><button onClick={()=>changeStock(m.id,10)} className="bg-green-100 text-green-700 px-3 py-2 rounded-lg text-sm font-bold">+10</button></div>
                <div className="flex gap-2"><input value={adjust[m.id]||''} onChange={e=>setAdjust({...adjust, [m.id]: e.target.value})} placeholder="+/- qtd" inputMode="numeric" className="w-20 border rounded-lg p-2 text-center" /><button onClick={()=>applyAdjust(m.id)} className="bg-slate-900 text-white px-3 py-2 rounded-lg text-sm font-bold">Ajustar</button></div>
              </div>
            );
          })}
        </div>
        <p className="text-xs text-slate-400 mt-4 text-center">O estoque baixa sozinho quando você vende no Caixa ou quando o cliente pede pelo cardápio. Se zerar, o item some do cardápio e aparece como SEM ESTOQUE no caixa.</p>
      </main>
    </div>
  );
}

function ClientView({ data, cart, setCart, showToast, setData, mesaParam }){
  const [category, setCategory] = useState('Todos');
  const [showCart, setShowCart] = useState(false);
  const [showCheckout, setShowCheckout] = useState(false);
  const [lastOrder, setLastOrder] = useState(null);
  const [checkout, setCheckout] = useState({ type:'mesa', mesa: mesaParam || '', nome:'', telefone:'', endereco:'' });
  useEffect(()=>{ if(mesaParam) setCheckout(c=>({...c, mesa: mesaParam, type:'mesa'})); },[mesaParam]);
  const activeMenu = data.menu.filter(m=>m.active!==false);
  const categories = ['Todos', ...new Set(activeMenu.map(m=>m.category||'Geral'))];
  const filtered = category==='Todos' ? activeMenu : activeMenu.filter(m=>(m.category||'Geral')===category);
  const cartDetailed = cart.map(c=>{ const item = data.menu.find(m=>m.id===c.id); return item ? { ...item, qty:c.qty } : null; }).filter(Boolean);
  const subtotal = cartDetailed.reduce((a,i)=>a + i.price*i.qty,0);
  const service = subtotal * 0.10;
  const total = subtotal + service;
  const cartCount = cartDetailed.reduce((a,i)=>a+i.qty,0);
  function addToCart(m){
    if((m.stock ?? 0) <= 0){ showToast(m.name + ' está esgotado'); return; }
    const inCart = cart.find(x=>x.id===m.id)?.qty || 0;
    if(inCart + 1 > (m.stock ?? 0)){ showToast('Só tem ' + m.stock + ' em estoque'); return; }
    setCart(prev=>{ const ex = prev.find(x=>x.id===m.id); if(ex) return prev.map(x=> x.id===m.id ? {...x, qty:x.qty+1} : x); return [...prev, {id:m.id, qty:1}]; });
    showToast(m.name + ' adicionado');
  }
  function removeFromCart(id){ setCart(prev=> prev.filter(x=>x.id!==id)); }
  function confirmOrder(){
    if(cartDetailed.length===0) return;
    if(checkout.type==='mesa' && !checkout.mesa){ showToast('Escolha a mesa'); return; }
    if(checkout.type==='delivery' && (!checkout.nome.trim() || !checkout.endereco.trim())){ showToast('Preencha nome e endereço para entrega'); return; }
    for(let it of cartDetailed){ const st = data.menu.find(m=>m.id===it.id)?.stock ?? 0; if(it.qty > st){ showToast('Sem estoque para ' + it.name + '. Tem ' + st); return; } }
    const id = String(Date.now()).slice(-6);
    const code = String(Math.floor(1000 + Math.random()*9000));
    const order = { id, table: checkout.type==='mesa' ? checkout.mesa : null, type: checkout.type, status:'pending', createdAt: Date.now(), code, customerName: checkout.nome, phone: checkout.telefone, address: checkout.endereco, items: cartDetailed.map(i=>({ name:i.name, price:i.price, qty:i.qty })), subtotal, service, total };
    setData(prev=>({...prev, orders:[...prev.orders, order], menu: prev.menu.map(m=>{ const sold = cartDetailed.find(c=>c.id===m.id); if(!sold) return m; return {...m, stock: Math.max(0, (m.stock ?? 0) - sold.qty)}; })}));
    setCart([]); setShowCart(false); setShowCheckout(false); setLastOrder(order); showToast('Pedido #' + id + ' enviado');
  }
  function sendWhatsApp(order){
    if(!data.restaurant.whatsapp){ showToast('WhatsApp não configurado no Admin'); return; }
    if(data.restaurant.whatsapp.length!==11){ showToast('WhatsApp incompleto no Admin. Precisa ter 11 dígitos.'); return; }
    const lines = order.items.map(i=> i.qty + 'x ' + i.name + ' - ' + formatBRL(i.price*i.qty)).join('%0A');
    const msg = 'Novo pedido #' + order.id + '%0A' + (order.type==='mesa' ? 'Mesa ' + order.table : 'Entrega para ' + order.customerName + ' - ' + order.address + ' - ' + order.phone) + '%0A' + lines + '%0A Total: ' + formatBRL(order.total) + (order.type==='delivery' ? '%0A Código de entrega: ' + order.code : '');
    window.open('https://wa.me/' + data.restaurant.whatsapp + '?text=' + msg, '_blank');
  }
  if(!data.restaurant.name){
    return (<div className="min-h-screen flex items-center justify-center p-6"><div className="bg-white max-w-md w-full p-6 rounded-2xl border text-center"><p className="font-bold text-xl">Cardápio ainda não configurado</p><p className="text-sm text-slate-500 mt-2">O dono ainda não cadastrou o restaurante.</p><a href="#/admin" className="inline-block mt-4 bg-slate-900 text-white px-5 py-3 rounded-xl font-bold text-sm">Ir para o Admin e configurar</a></div></div>);
  }
  return (
    <div className="min-h-screen pb-28">
      <div className="relative h-56 bg-slate-800"><button onClick={goBack} className="absolute top-4 left-4 z-10 bg-black/60 text-white px-3 py-2 rounded-full text-sm font-bold">← Voltar</button>{data.restaurant.cover ? <img src={data.restaurant.cover} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-white/60 text-sm">Sem foto de capa</div>}<div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex items-end p-5"><div><h1 className="text-white text-3xl font-extrabold">{data.restaurant.name}</h1><p className="text-white/80 text-sm mt-1">{mesaParam ? 'Mesa ' + mesaParam + ' • Pedido pelo celular' : 'Peça pelo celular • Sem fila'}</p></div></div></div>
      <div className="max-w-3xl mx-auto p-4">
        <div className="flex gap-2 overflow-x-auto pb-2">{categories.map(c=> <button key={c} onClick={()=>setCategory(c)} className={'px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap ' + (category===c ? 'bg-slate-900 text-white' : 'bg-white border')}>{c}</button>)}</div>
        {filtered.length===0 && <div className="bg-white p-6 rounded-2xl text-center mt-4"><p className="font-bold">Nenhum item nesta categoria</p><p className="text-sm text-slate-500 mt-1">Cadastre itens no Admin.</p></div>}
        <div className="grid md:grid-cols-2 gap-4 mt-2">{filtered.map(m=>{ const out = (m.stock ?? 0) <= 0; return (<div key={m.id} className={'bg-white p-3 rounded-2xl border flex gap-3 ' + (out ? 'opacity-60' : '')}>{m.img ? <img src={m.img} className="w-24 h-24 rounded-xl object-cover" /> : <div className="w-24 h-24 bg-slate-100 rounded-xl flex items-center justify-center text-xs text-slate-400">Sem foto</div>}<div className="flex-1 flex flex-col justify-between py-1"><div><h3 className="font-bold">{m.name}</h3><p className="text-xs text-slate-500 mt-1">{m.desc}</p><p className={'text-xs font-bold mt-1 ' + (out ? 'text-red-600' : 'text-green-600')}>{out ? 'ESGOTADO' : 'Em estoque: ' + m.stock}</p></div><div className="flex justify-between items-center mt-2"><span className="font-bold text-lg">{formatBRL(m.price)}</span><button disabled={out} onClick={()=>addToCart(m)} className="w-9 h-9 rounded-full bg-orange-100 text-orange-600 font-bold text-xl disabled:opacity-30">+</button></div></div></div>); })}</div>
      </div>
      {cartCount>0 && (<div className="fixed bottom-4 left-0 right-0 px-4 flex justify-center z-30"><button onClick={()=>setShowCart(true)} className="bg-slate-900 text-white w-full max-w-md px-5 py-4 rounded-2xl shadow-xl flex justify-between"><span>{cartCount} itens • Ver sacola</span><span className="font-bold">{formatBRL(total)}</span></button></div>)}
      {showCart && (<div className="fixed inset-0 z-40 flex items-end justify-center"><div className="absolute inset-0 bg-black/50" onClick={()=>setShowCart(false)}></div><div className="relative bg-white w-full max-w-md rounded-t-3xl p-5 max-h-[85vh] overflow-y-auto"><h2 className="font-bold text-xl">Sua sacola</h2><div className="space-y-3 my-4">{cartDetailed.map(i=>(<div key={i.id} className="flex justify-between"><span>{i.qty}x {i.name}</span><span className="font-bold">{formatBRL(i.price*i.qty)} <button onClick={()=>removeFromCart(i.id)} className="text-red-500 text-sm ml-2">Remover</button></span></div>))}</div><div className="bg-slate-50 p-3 rounded-xl space-y-1 text-sm"><div className="flex justify-between"><span>Subtotal</span><span>{formatBRL(subtotal)}</span></div><div className="flex justify-between"><span>Taxa de serviço 10%</span><span>{formatBRL(service)}</span></div><div className="flex justify-between font-bold text-base pt-2 border-t"><span>Total</span><span>{formatBRL(total)}</span></div></div><button onClick={()=>{setShowCart(false); setShowCheckout(true);}} className="w-full bg-orange-600 text-white font-bold py-4 rounded-xl mt-4">Continuar para confirmar</button></div></div>)}
      {showCheckout && (<div className="fixed inset-0 z-50 flex items-end justify-center"><div className="absolute inset-0 bg-black/50" onClick={()=>setShowCheckout(false)}></div><div className="relative bg-white w-full max-w-md rounded-t-3xl p-5"><h2 className="font-bold text-xl">Confirmar pedido</h2><div className="flex gap-2 mt-4"><button onClick={()=>setCheckout({...checkout, type:'mesa'})} className={'flex-1 py-3 rounded-xl font-bold text-sm ' + (checkout.type==='mesa' ? 'bg-slate-900 text-white' : 'border')}>Comer no local</button><button onClick={()=>setCheckout({...checkout, type:'delivery'})} className={'flex-1 py-3 rounded-xl font-bold text-sm ' + (checkout.type==='delivery' ? 'bg-slate-900 text-white' : 'border')}>Entrega</button></div>{checkout.type==='mesa' ? (<div className="mt-4"><label className="text-sm font-semibold">Mesa</label><select value={checkout.mesa} onChange={e=>setCheckout({...checkout, mesa:e.target.value})} className="w-full border rounded-lg p-2.5 mt-1"><option value="">Escolha a mesa</option>{data.tables.map(n=><option key={n} value={n}>Mesa {n}</option>)}</select></div>) : (<div className="space-y-3 mt-4"><input value={checkout.nome} onChange={e=>setCheckout({...checkout, nome:e.target.value})} placeholder="Seu nome" className="w-full border rounded-lg p-2.5" /><input value={checkout.telefone} onChange={e=>setCheckout({...checkout, telefone:e.target.value.replace(/\D/g,'').slice(0,11)})} placeholder="Seu telefone, DDD + número, 11 dígitos" maxLength={11} inputMode="numeric" className="w-full border rounded-lg p-2.5" /><input value={checkout.endereco} onChange={e=>setCheckout({...checkout, endereco:e.target.value})} placeholder="Endereço completo" className="w-full border rounded-lg p-2.5" /><p className="text-xs text-slate-500">Você vai receber um código de 4 dígitos para entregar ao motoca.</p></div>)}<p className="font-bold text-lg mt-4">Total: {formatBRL(total)}</p><button onClick={confirmOrder} className="w-full bg-orange-600 text-white font-bold py-4 rounded-xl mt-3">Confirmar pedido</button></div></div>)}
      {lastOrder && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4"><div className="absolute inset-0 bg-black/50" onClick={()=>setLastOrder(null)}></div><div className="relative bg-white w-full max-w-md rounded-2xl p-6 text-center"><p className="text-4xl">✅</p><h2 className="font-bold text-xl mt-2">Pedido #{lastOrder.id} enviado</h2><p className="text-sm text-slate-500 mt-1">{data.restaurant.message}</p>{lastOrder.type==='delivery' && <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mt-3"><p className="text-sm font-bold">Seu código de entrega: {lastOrder.code}</p><p className="text-xs text-amber-800">Mostre esse código para o entregador.</p></div>}{lastOrder.type==='mesa' && <p className="text-sm mt-3">Mesa {lastOrder.table} • A cozinha já recebeu.</p>}<p className="font-bold mt-3">Total: {formatBRL(lastOrder.total)}</p>{data.restaurant.whatsapp && <button onClick={()=>sendWhatsApp(lastOrder)} className="w-full bg-green-600 text-white font-bold py-3 rounded-xl mt-3">Enviar também pelo WhatsApp</button>}<button onClick={()=>setLastOrder(null)} className="w-full border font-bold py-3 rounded-xl mt-2">Fechar</button></div></div>)}
    </div>
  );
}

function KitchenView({ data, setData, showToast }){
  const pending = data.orders.filter(o=>o.status==='pending');
  const ready = data.orders.filter(o=>o.status==='ready');
  function setStatus(id, status){ setData(prev=>({...prev, orders: prev.orders.map(o=> o.id===id ? {...o, status} : o)})); showToast('Pedido #' + id + ' atualizado'); }
  return (<div className="min-h-screen bg-slate-100"><header className="bg-white p-4 border-b flex justify-between items-center"><div className="flex items-center gap-3"><button onClick={goBack} className="bg-slate-100 px-3 py-2 rounded-lg text-sm font-bold">← Voltar</button><div><h1 className="font-bold text-xl">Cozinha • {data.restaurant.name || 'Sem restaurante'}</h1><p className="text-xs text-slate-500">Só pedidos reais que o cliente confirmou.</p></div></div><div className="flex gap-4 text-center"><div><p className="text-xs font-bold text-slate-400">PENDENTES</p><p className="font-bold text-xl">{pending.length}</p></div><div><p className="text-xs font-bold text-slate-400">PRONTOS</p><p className="font-bold text-xl text-green-600">{ready.length}</p></div></div></header><main className="p-4 flex gap-4 overflow-x-auto">{pending.length===0 && <div className="w-full text-center mt-16 text-slate-400"><p className="text-4xl">🍳</p><p className="mt-2 font-semibold">Nenhum pedido pendente</p></div>}{pending.map(o=>(<div key={o.id} className="bg-white w-72 shrink-0 rounded-2xl border-l-4 border-orange-500 p-4"><div className="flex justify-between"><span className="bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs font-bold">{o.type==='delivery' ? 'ENTREGA' : 'MESA ' + o.table}</span><span className="text-xs text-slate-400">{timeOf(o.createdAt)}</span></div><p className="font-bold mt-3">Pedido #{o.id}</p><div className="bg-slate-50 rounded-lg p-3 mt-2 text-sm space-y-1">{o.items.map((it,idx)=><div key={idx} className="flex justify-between"><span>{it.name}</span><b>x{it.qty}</b></div>)}</div><button onClick={()=>setStatus(o.id,'ready')} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm mt-3">MARCAR PRONTO</button></div>))}{ready.map(o=>(<div key={o.id} className="bg-white w-72 shrink-0 rounded-2xl border-l-4 border-green-500 p-4"><p className="text-xs font-bold text-green-600">PRONTO</p><p className="font-bold mt-2">Pedido #{o.id} • {o.type==='delivery' ? 'Entrega' : 'Mesa ' + o.table}</p>{o.type!=='delivery' && <button onClick={()=>setStatus(o.id,'delivered')} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-sm mt-3">ENTREGUE NA MESA</button>}{o.type==='delivery' && <p className="text-xs text-slate-500 mt-3">Aparece para o entregador.</p>}</div>))}</main></div>);
}

function DeliveryView({ data, setData, showToast }){
  const [codes, setCodes] = useState({});
  const ready = data.orders.filter(o=>o.type==='delivery' && o.status==='ready');
  const waiting = data.orders.filter(o=>o.type==='delivery' && o.status==='pending');
  function confirmDelivery(o){ const typed = (codes[o.id]||'').trim(); if(typed !== o.code){ showToast('Código incorreto. Peça o código de 4 dígitos para o cliente.'); return; } setData(prev=>({...prev, orders: prev.orders.map(x=> x.id===o.id ? {...x, status:'delivered'} : x)})); showToast('Entrega #' + o.id + ' finalizada'); }
  return (<div className="min-h-screen bg-slate-50"><header className="bg-blue-600 text-white p-4"><div className="flex items-center gap-3"><button onClick={goBack} className="bg-white/20 px-3 py-2 rounded-lg text-sm font-bold">← Voltar</button><div><h1 className="font-bold text-xl">Entregas • {data.restaurant.name || 'Sem restaurante'}</h1><p className="text-xs text-blue-100">Só entregas reais, prontas na cozinha.</p></div></div></header><main className="p-4 space-y-4 max-w-2xl mx-auto">{ready.length===0 && <div className="bg-white p-6 rounded-2xl text-center"><p className="text-4xl">🛵</p><p className="font-bold mt-2">Nenhuma entrega pronta</p>{waiting.length>0 && <p className="text-xs text-slate-400 mt-2">{waiting.length} entrega(s) aguardando a cozinha.</p>}</div>}{ready.map(o=>(<div key={o.id} className="bg-white p-5 rounded-2xl border"><div className="flex justify-between"><div><h3 className="font-bold text-lg">Pedido #{o.id}</h3><p className="text-sm text-slate-500">{o.customerName} • {o.address}</p><p className="text-sm text-slate-500">{o.phone} • {timeOf(o.createdAt)}</p></div><span className="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold h-fit">PRONTO</span></div><div className="bg-slate-50 p-3 rounded-lg mt-3 text-sm space-y-1">{o.items.map((it,idx)=><div key={idx} className="flex justify-between"><span>{it.qty}x {it.name}</span><span>{formatBRL(it.price*it.qty)}</span></div>)}<div className="flex justify-between font-bold pt-2 border-t"><span>Total</span><span>{formatBRL(o.total)}</span></div></div><div className="flex gap-2 mt-4"><div className="flex-1"><label className="text-xs font-bold text-slate-500">CÓDIGO DO CLIENTE, 4 DÍGITOS</label><input value={codes[o.id]||''} onChange={e=>setCodes({...codes, [o.id]: e.target.value})} inputMode="numeric" placeholder="Ex: 1234" className="w-full border rounded-lg p-2.5 mt-1 text-center font-mono text-lg tracking-widest" /></div><button onClick={()=>confirmDelivery(o)} className="bg-blue-600 text-white px-6 rounded-lg font-bold">Entregar</button></div></div>))}</main></div>);
}

function App(){
  const [data, setData] = useState(loadInitial);
  const [route, setRoute] = useState(parseHash);
  const [cart, setCart] = useState([]);
  const [toast, setToast] = useState('');
  const [unlocked, setUnlocked] = useState({});
  function onUnlock(role){
    if(role==='__reset_admin__'){
      setData(prev=>({...prev, passwords:{...prev.passwords, admin:''}}));
      setUnlocked(prev=>({...prev, admin:true}));
      showToast('Senha do admin zerada. Defina uma nova em Senhas de acesso.');
      return;
    }
    setUnlocked(prev=>({...prev, [role]:true}));
  }
  function showToast(m){ setToast(m); setTimeout(()=>setToast(''),3000); }
  useEffect(()=>{ const onHash = ()=> setRoute(parseHash()); window.addEventListener('hashchange', onHash); return ()=> window.removeEventListener('hashchange', onHash); },[]);
  const [loaded, setLoaded] = useState(false);
  const lastSyncedRef = useRef('');
  const isFetchingRef = useRef(false);
  // Carrega do D1 na primeira abertura
  useEffect(()=>{
    (async ()=>{
      try{
        const r = await fetch('/api/sync');
        if(r.ok){
          const apiData = await r.json();
          // Se o D1 já tem restaurante ou cardápio, usa ele. Se está vazio e tem dados locais, migra os locais para o D1.
          const apiHasData = (apiData.menu && apiData.menu.length>0) || (apiData.restaurant && apiData.restaurant.name);
          const localRaw = localStorage.getItem(KEY);
          if(apiHasData){
            const norm = { ...apiData, passwords: apiData.passwords || { admin:'', caixa:'', cozinha:'', entrega:'', estoque:'' } };
            lastSyncedRef.current = JSON.stringify(norm);
            setData(norm);
            try{ localStorage.setItem(KEY, JSON.stringify(norm)); }catch(e){}
          } else if(localRaw){
            try{
              const localData = JSON.parse(localRaw);
              if(localData && localData.restaurant && (localData.restaurant.name || (localData.menu||[]).length>0)){
                await fetch('/api/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(localData) });
                lastSyncedRef.current = JSON.stringify(localData);
              }
            }catch(e){}
          }
        }
      }catch(e){ /* sem internet ou sem D1, usa localStorage */ }
      setLoaded(true);
    })();
  },[]);
  // Salva no D1 quando muda (com debounce) + mantém cópia local como backup
  useEffect(()=>{
    if(!loaded) return;
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
    const json = JSON.stringify(data);
    if(json===lastSyncedRef.current) return;
    const timer = setTimeout(async ()=>{
      try{
        const r = await fetch('/api/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body: json });
        if(r.ok) lastSyncedRef.current = json;
      }catch(e){}
    }, 600);
    return ()=> clearTimeout(timer);
  },[data, loaded]);
  // Polling do D1 a cada 3s para sincronizar entre aparelhos
  useEffect(()=>{
    if(!loaded) return;
    const iv = setInterval(async ()=>{
      if(isFetchingRef.current) return;
      isFetchingRef.current = true;
      try{
        const r = await fetch('/api/sync');
        if(r.ok){
          const apiData = await r.json();
          const norm = { ...apiData, passwords: apiData.passwords || { admin:'', caixa:'', cozinha:'', entrega:'', estoque:'' } };
          const json = JSON.stringify(norm);
          if(json!==JSON.stringify(data) && json!==lastSyncedRef.current){
            lastSyncedRef.current = json;
            setData(norm);
            try{ localStorage.setItem(KEY, JSON.stringify(norm)); }catch(e){}
          }
        }
      }catch(e){}
      isFetchingRef.current = false;
    }, 3000);
    return ()=> clearInterval(iv);
  },[data, loaded]);
  return (<div>{route.view==='admin' && <AuthGate role="admin" title="Admin" passwords={data.passwords} unlocked={!!unlocked.admin} onUnlock={onUnlock}><AdminView data={data} setData={setData} showToast={showToast} /></AuthGate>}{route.view==='cliente' && <ClientView data={data} cart={cart} setCart={setCart} showToast={showToast} setData={setData} mesaParam={route.mesa} />}{route.view==='cozinha' && <AuthGate role="cozinha" title="Cozinha" passwords={data.passwords} unlocked={!!unlocked.cozinha} onUnlock={onUnlock}><KitchenView data={data} setData={setData} showToast={showToast} /></AuthGate>}{route.view==='entrega' && <AuthGate role="entrega" title="Entrega" passwords={data.passwords} unlocked={!!unlocked.entrega} onUnlock={onUnlock}><DeliveryView data={data} setData={setData} showToast={showToast} /></AuthGate>}{route.view==='caixa' && <AuthGate role="caixa" title="Frente de Caixa" passwords={data.passwords} unlocked={!!unlocked.caixa} onUnlock={onUnlock}><CaixaView data={data} setData={setData} showToast={showToast} /></AuthGate>}{route.view==='estoque' && <AuthGate role="estoque" title="Estoque" passwords={data.passwords} unlocked={!!unlocked.estoque} onUnlock={onUnlock}><EstoqueView data={data} setData={setData} showToast={showToast} /></AuthGate>}{toast && <div className="fixed top-4 right-4 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl z-[100] text-sm font-semibold">{toast}</div>}</div>);
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
